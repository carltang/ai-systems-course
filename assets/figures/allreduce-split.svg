<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="all-reduce 拆成两个半程">
  <title>all-reduce 拆成两个半程</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="232" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">数据并行：两个半程连着做，就是一次 all-reduce</text>
  <rect x="24" y="50" width="200" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="124.0" y="75.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">反向传播</text>
  <rect x="230" y="50" width="150" height="40" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="305.0" y="75.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">reduce-scatter</text>
  <rect x="386" y="50" width="150" height="40" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="461.0" y="75.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">all-gather</text>
  <rect x="542" y="50" width="194" height="40" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="639.0" y="75.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">更新全部参数</text>
  <text x="24" y="132" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">ZeRO / FSDP：中间隔开，每张卡只更新自己负责的那一段</text>
  <rect x="24" y="148" width="160" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="104.0" y="173.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">反向传播</text>
  <rect x="190" y="148" width="150" height="40" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="265.0" y="173.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">reduce-scatter</text>
  <rect x="346" y="148" width="150" height="40" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="421.0" y="173.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">更新自己那一段</text>
  <rect x="502" y="148" width="110" height="40" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="557.0" y="173.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">all-gather</text>
  <rect x="618" y="148" width="118" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="677.0" y="173.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">下一次前向</text>
  <text x="24" y="216" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">通信总量一样；换来的是每张卡不必存全部的梯度和优化器状态</text>
</svg>
