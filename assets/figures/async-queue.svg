<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 226" width="760" height="226" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="GPU 是异步执行的">
  <title>GPU 是异步执行的</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="226" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">时间从左到右：CPU 发任务，GPU 稍后才做</text>
  <text x="24" y="82" font-size="14" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">CPU</text>
  <text x="24" y="152" font-size="14" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">GPU</text>
  <rect x="84" y="62" width="36" height="34" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
