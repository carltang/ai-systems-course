<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="前向保存中间结果，反向沿链式法则往回算">
  <title>前向保存中间结果，反向沿链式法则往回算</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="232" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">前向：从左到右算，把每层的输出留着</text>
  <rect x="40" y="50" width="104" height="56" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="92.0" y="74.0" font-size="16" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">x</text>
  <text x="92.0" y="95.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">输入</text>
  <rect x="232" y="50" width="104" height="56" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="284.0" y="74.0" font-size="16" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">a</text>
  <text x="284.0" y="95.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">第一层的输出</text>
  <rect x="424" y="50" width="104" height="56" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="476.0" y="74.0" font-size="16" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">b</text>
  <text x="476.0" y="95.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">第二层的输出</text>
  <rect x="616" y="50" width="104" height="56" rx="10" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="668.0" y="74.0" font-size="16" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">L</text>
  <text x="668.0" y="95.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">损失</text>
  <line x1="146" y1="78" x2="230" y2="78" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="338" y1="78" x2="422" y2="78" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="530" y1="78" x2="614" y2="78" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="24" y="150" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">反向：从右到左算，每层只做一次</text>
  <rect x="232" y="166" width="104" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="284.0" y="193.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">∂L/∂a</text>
  <rect x="424" y="166" width="104" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="476.0" y="193.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">∂L/∂b</text>
  <rect x="616" y="166" width="104" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="668.0" y="193.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">1</text>
  <rect x="40" y="166" width="104" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="92.0" y="193.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">∂L/∂x</text>
  <line x1="230" y1="188" x2="146" y2="188" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="188.0" y="181.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">× 局部导数</text>
  <line x1="422" y1="188" x2="338" y2="188" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="380.0" y="181.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">× 局部导数</text>
  <line x1="614" y1="188" x2="530" y2="188" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="572.0" y="181.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">× 局部导数</text>
  <line x1="284" y1="108" x2="284" y2="164" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#tip)"/>
  <line x1="476" y1="108" x2="476" y2="164" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#tip)"/>
  <text x="488" y="140" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">局部导数要用到前向时留下的值</text>
  <text x="746" y="223" font-size="9.5" fill="#b9b3a6" text-anchor="end" letter-spacing=".04em">© Zongyao Tang with Claude · CC BY-NC-SA 4.0</text>
</svg>
