<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" width="760" height="214" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="案例二：丢掉的 38% 去了哪里">
  <title>案例二：丢掉的 38% 去了哪里</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="214" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">案例二：8 张卡的理想吞吐是 160 万 token/秒，实测 100 万</text>
  <rect x="24" y="56" width="438" height="54" rx="7" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="244.72" y="80" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">实际得到的</text>
  <text x="244.72" y="99" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">62%</text>
  <rect x="465" y="56" width="139" height="54" rx="7" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="536.64" y="80" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">数据加载抢 CPU</text>
  <text x="536.64" y="99" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">约 20%</text>
  <rect x="608" y="56" width="111" height="54" rx="7" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="664.8000000000001" y="80" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">NUMA 慢进程</text>
  <text x="664.8000000000001" y="99" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">约 16%</text>
  <rect x="722" y="56" width="11" height="54" rx="7" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="736" y="132" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing=".02em">最右一小条：通信本身，只有 1%–2%。“NUMA 慢进程”是一个位置放错的进程拖累了全体</text>
  <text x="24" y="170" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">“把通信拿掉”只花了几分钟，就把问题一分为二：丢的大部分和通信无关</text>
  <text x="24" y="192" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">比例是讲解里的数字；这是一个编出来的综合案例，不是实测</text>
</svg>
