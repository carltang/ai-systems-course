<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" width="760" height="214" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="案例一：瓶颈一个接一个地移动">
  <title>案例一：瓶颈一个接一个地移动</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="214" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">案例一：同一个训练任务先后遇到的四类瓶颈</text>
  <rect x="24" y="60" width="96" height="60" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="72.0" y="86.0" font-size="16" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">4 万</text>
  <text x="72.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">token/秒</text>
  <rect x="142" y="60" width="110" height="60" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="197.0" y="86.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">等数据</text>
  <text x="197.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">数据加载（2.4）</text>
  <line x1="122" y1="90" x2="140" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="268" y="60" width="110" height="60" rx="10" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="323.0" y="86.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">同步点</text>
  <text x="323.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">3.6</text>
  <line x1="248" y1="90" x2="266" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="394" y="60" width="110" height="60" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="449.0" y="86.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">发令开销</text>
  <text x="449.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">2.3、2.5</text>
  <line x1="374" y1="90" x2="392" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="520" y="60" width="110" height="60" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="575.0" y="86.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">算力</text>
  <text x="575.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">混合精度（2.6）</text>
  <line x1="500" y1="90" x2="518" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="632" y1="90" x2="648" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="648" y="60" width="88" height="60" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="692.0" y="86.0" font-size="16" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">20 万</text>
  <text x="692.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">token/秒</text>
  <text x="24" y="158" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">五次改动，每次都先量再改；顺序由测量决定</text>
  <text x="24" y="180" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">一上来就开混合精度的话吞吐几乎不变：当时 GPU 六成的时间在等数据</text>
</svg>
