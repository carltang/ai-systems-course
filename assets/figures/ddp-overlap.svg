<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="DDP：一边反向，一边通信">
  <title>DDP：一边反向，一边通信</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="232" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">时间从左到右：反向从最后一层往前算，桶齐一个就发一个</text>
  <text x="24" y="78" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">反向计算</text>
  <text x="24" y="134" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">通信</text>
  <rect x="120" y="58" width="122" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="181.0" y="80.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">第 1 桶的那几层</text>
  <rect x="246" y="114" width="122" height="34" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="307.0" y="136.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">第 1 桶 all-reduce</text>
  <rect x="246" y="58" width="122" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="307.0" y="80.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">第 2 桶的那几层</text>
  <rect x="372" y="114" width="122" height="34" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="433.0" y="136.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">第 2 桶 all-reduce</text>
  <rect x="372" y="58" width="122" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="433.0" y="80.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">第 3 桶的那几层</text>
  <rect x="498" y="114" width="122" height="34" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="559.0" y="136.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">第 3 桶 all-reduce</text>
  <rect x="498" y="58" width="122" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="559.0" y="80.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">第 4 桶的那几层</text>
  <rect x="624" y="114" width="122" height="34" rx="10" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="685.0" y="136.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">第 4 桶 all-reduce</text>
  <line x1="622" y1="48" x2="622" y2="160" stroke="#d9d4c8" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="616" y="176" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing=".02em">反向结束</text>
  <text x="628" y="176" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">最后一桶露在外面</text>
  <text x="24" y="212" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">绿色的通信被反向计算遮住了；通信比反向慢的话，露出来的会更多</text>
</svg>
