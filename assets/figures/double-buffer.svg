<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 242" width="760" height="242" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="双缓冲：搬和算重叠">
  <title>双缓冲：搬和算重叠</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="242" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">时间从左到右：算这一块的同时，搬下一块</text>
  <text x="24" y="84" font-size="14" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">缓冲区 1</text>
