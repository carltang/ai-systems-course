  <rect x="296" y="58" width="140" height="40" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="366.0" y="83.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">装第 3 块</text>
  <rect x="442" y="58" width="140" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="512.0" y="83.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">算第 3 块</text>
  <rect x="588" y="58" width="140" height="40" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="658.0" y="83.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">装第 5 块</text>
  <text x="24" y="140" font-size="14" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">缓冲区 2</text>
  <rect x="150" y="114" width="140" height="40" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="220.0" y="139.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">装第 2 块</text>
  <rect x="296" y="114" width="140" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="366.0" y="139.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">算第 2 块</text>
  <rect x="442" y="114" width="140" height="40" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="512.0" y="139.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">装第 4 块</text>
  <rect x="588" y="114" width="140" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="658.0" y="139.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">算第 4 块</text>
  <text x="150" y="184" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">蓝色：运算单元在算    黄色：数据从显存搬进来（异步，发出后不等）</text>
  <text x="24" y="208" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">一轮的时间从“搬 + 算”变成两者中较长的那个；代价是多一块缓冲区</text>
