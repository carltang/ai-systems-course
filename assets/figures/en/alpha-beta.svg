  <text x="716.0" y="270" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">1 GB</text>
  <text x="88" y="239.0375422156689" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">10 µs</text>
