<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 242" width="760" height="242" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The GPU executes asynchronously">
  <title>The GPU executes asynchronously</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="242" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Time runs left to right: the CPU issues tasks, the GPU does them later</text>
  <text x="24" y="82" font-size="14" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">CPU</text>
  <text x="24" y="152" font-size="14" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">GPU</text>
  <rect x="84" y="62" width="36" height="34" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="102.0" y="84.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">1</text>
  <rect x="126" y="62" width="36" height="34" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="144.0" y="84.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">2</text>
  <rect x="168" y="62" width="36" height="34" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="186.0" y="84.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">3</text>
  <rect x="210" y="62" width="36" height="34" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="228.0" y="84.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">4</text>
  <rect x="262" y="62" width="356" height="34" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="440.0" y="84.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">needs a number from the result: stops and waits</text>
  <rect x="90" y="132" width="150" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="165.0" y="154.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">run task 1</text>
  <rect x="244" y="132" width="110" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="299.0" y="154.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">run task 2</text>
  <rect x="358" y="132" width="160" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="438.0" y="154.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">run task 3</text>
  <rect x="522" y="132" width="104" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="574.0" y="154.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">run task 4</text>
  <rect x="624" y="62" width="112" height="34" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="680.0" y="84.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">continues</text>
  <line x1="620" y1="52" x2="620" y2="176" stroke="#d9d4c8" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="166" y="116" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">ordering: a few µs each time</text>
  <text x="24" y="206" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Stop the clock right after &quot;ordering&quot; and you measure only the ordering; synchronise before and after timing</text>
  <text x="746" y="234" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
