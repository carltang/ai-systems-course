<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Standard attention: small inputs and outputs, large intermediate results">
  <title>Standard attention: small inputs and outputs, large intermediate results</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="266" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">The size of each tensor in standard attention (with N = 4096, d = 64)</text>
  <rect x="24" y="96" width="26" height="110" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="37.0" y="156.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Q</text>
  <rect x="58" y="96" width="26" height="110" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="71.0" y="156.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">K</text>
  <rect x="92" y="96" width="26" height="110" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="105.0" y="156.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">V</text>
  <text x="73" y="226" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">inputs: N×d each</text>
  <rect x="190" y="56" width="190" height="150" rx="10" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="285.0" y="127.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">S scores</text>
  <text x="285.0" y="148.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">N×N, written to memory</text>
  <rect x="410" y="56" width="190" height="150" rx="10" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="505.0" y="127.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">P weights</text>
  <text x="505.0" y="148.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">N×N, written to memory</text>
  <rect x="668" y="96" width="26" height="110" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="681.0" y="156.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">O</text>
  <text x="681" y="226" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">output: N×d</text>
  <line x1="128" y1="150" x2="188" y2="150" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="382" y1="130" x2="408" y2="130" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="602" y1="150" x2="666" y2="150" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="395" y="226" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">The intermediates are 64× the size, and cross GPU memory several times</text>
  <text x="746" y="258" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
