<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" width="760" height="252" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="One multiply-add forward becomes two backward">
  <title>One multiply-add forward becomes two backward</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="252" rx="14" fill="#fbf9f4"/>
  <text x="24" y="32" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Y = XW taken down to its smallest step: one multiply-add</text>
  <rect x="24" y="82" width="240" height="80" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="144.0" y="118.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">y[b,j] += x[b,i] × w[i,j]</text>
  <text x="144.0" y="139.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">Forward: once for every (b, i, j)</text>
  <rect x="446" y="56" width="290" height="66" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="591.0" y="85.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">dw[i,j] += dy[b,j] × x[b,i]</text>
  <text x="591.0" y="106.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">Gathered over all b: dW = Xᵀ dY</text>
  <rect x="446" y="140" width="290" height="66" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="591.0" y="169.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">dx[b,i] += dy[b,j] × w[i,j]</text>
  <text x="591.0" y="190.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">Gathered over all j: dX = dY Wᵀ</text>
  <line x1="266" y1="122" x2="300" y2="122" stroke="#6b7280" stroke-width="1.4"/>
  <path d="M300 122 L300 89 L443 89" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="372" y="81" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">w&#x27;s gradient: times x</text>
  <path d="M300 122 L300 173 L443 173" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="372" y="165" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">x&#x27;s gradient: times w</text>
  <text x="24" y="224" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">Each input wants its own gradient: B × D_in × D_out multiply-adds forward, twice that backward</text>
  <text x="746" y="244" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
