  <text x="24" y="196" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">The other 127 processes are all stopped at the next all-reduce waiting for it, forever</text>
  <text x="24" y="218" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">They report no error: from their point of view, the other side just is not ready yet. So the job shows &quot;running&quot;, and</tspan><tspan x="24" dy="17.5">utilisation is 0</tspan></text>
