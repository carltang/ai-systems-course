  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">fraction wasted</text>
  <text x="716" y="258" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">checkpoint interval T</text>
  <text x="259.49333333333334" y="258" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">T = √(2 × c × M)</text>
  <text x="130" y="82" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">cost of saving c/T</text>
  <text x="712" y="176" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">loss from failures T/(2M)</text>
  <text x="329.49333333333334" y="118" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">the sum of the two</text>
  <text x="24" y="286" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">The total is smallest where the two terms are equal. c is the time of one save, M the mean time between failures</text>
