<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Troubleshooting communication layer by layer">
  <title>Troubleshooting communication layer by layer</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="296" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Bottom up: once a layer is fine, look at the one above</text>
  <rect x="24" y="50" width="190" height="40" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="119.0" y="75.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Layer 4: framework</text>
  <text x="230" y="68" font-size="13" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">is communication in training waiting for something else?</text>
  <text x="230" y="85" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">one process is slow and all wait for it at the sync point</text>
  <rect x="24" y="100" width="190" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="119.0" y="125.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Layer 3: NCCL</text>
  <text x="230" y="118" font-size="13" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">is NCCL using this road?</text>
  <text x="230" y="135" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">busbw from nccl-tests, the initialisation log</text>
  <rect x="24" y="150" width="190" height="40" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="119.0" y="175.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Layer 2: bare transport</text>
  <text x="230" y="168" font-size="13" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">without NCCL, how fast can this road go?</text>
  <text x="230" y="185" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">nvbandwidth, ib_write_bw</text>
  <rect x="24" y="200" width="190" height="40" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="119.0" y="225.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Layer 1: links and devices</text>
  <text x="230" y="218" font-size="13" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">is the hardware itself good?</text>
  <text x="230" y="235" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">nvidia-smi topo, ibstat, perfquery, dmesg</text>
  <line x1="744" y1="236" x2="744" y2="56" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="24" y="268" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">At every layer scale up &quot;one machine → two → all&quot;; change one condition at a time</text>
  <text x="746" y="288" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
