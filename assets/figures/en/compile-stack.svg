<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" width="760" height="228" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The three-layer stack of torch.compile">
  <title>The three-layer stack of torch.compile</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="228" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">The three layers of torch.compile, and what each hands to the next</text>
  <rect x="72" y="84" width="170" height="62" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="157.0" y="111.0" font-size="14.1" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">TorchDynamo</text>
  <text x="157.0" y="132.0" font-size="11.8" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">handles Python&#x27;s dynamism</text>
  <rect x="294" y="84" width="170" height="62" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="379.0" y="102.8" font-size="13.8" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">AOTAutograd</text>
  <text x="379.0" y="120.9" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="379.0" dy="0">handles differentiation,</tspan><tspan x="379.0" dy="15.2">simplification</tspan></text>
  <rect x="516" y="84" width="170" height="62" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="601.0" y="111.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Inductor</text>
  <text x="601.0" y="132.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">handles performance</text>
  <text x="60" y="70" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">Python bytecode</text>
  <text x="268" y="172" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">forward graph + guards</text>
  <text x="490" y="70" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">forward + backward graph</text>
  <text x="700" y="172" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">fused kernels</text>
  <line x1="244" y1="115" x2="292" y2="115" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="466" y1="115" x2="514" y2="115" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="26" y1="115" x2="70" y2="115" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="688" y1="115" x2="734" y2="115" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="24" y="200" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Where no graph can be captured, it falls back to ordinary Python: at worst, no speed-up</text>
  <text x="746" y="220" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
