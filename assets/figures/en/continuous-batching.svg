<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Static batching and continuous batching">
  <title>Static batching and continuous batching</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="340" rx="14" fill="#fbf9f4"/>
  <text x="24" y="38" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Static batching: the whole batch waits for the longest to end, and finished slots sit empty</text>
  <text x="24" y="65" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">slot 1</text>
  <rect x="90" y="48" width="646" height="22" rx="5" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1"/>
  <rect x="90" y="48" width="646" height="22" rx="5" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1"/>
  <text x="413.0" y="64" font-size="11.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">request 1</text>
  <text x="24" y="91" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">slot 2</text>
  <rect x="90" y="74" width="646" height="22" rx="5" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1"/>
  <rect x="90" y="74" width="78" height="22" rx="5" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1"/>
  <text x="128.76" y="90" font-size="11.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">2</text>
  <text x="24" y="117" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">slot 3</text>
  <rect x="90" y="100" width="646" height="22" rx="5" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1"/>
  <rect x="90" y="100" width="258" height="22" rx="5" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1"/>
  <text x="219.2" y="116" font-size="11.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">request 3</text>
  <text x="24" y="143" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">slot 4</text>
  <rect x="90" y="126" width="646" height="22" rx="5" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1"/>
  <rect x="90" y="126" width="162" height="22" rx="5" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1"/>
  <text x="170.75" y="142" font-size="11.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">request 4</text>
  <text x="24" y="176" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Continuous batching: scheduled at every step, the finished leave and the waiting fill in</text>
  <text x="24" y="203" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">slot 1</text>
  <rect x="90" y="186" width="646" height="22" rx="5" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1"/>
  <rect x="90" y="186" width="646" height="22" rx="5" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1"/>
  <text x="413.0" y="202" font-size="11.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">request 1</text>
  <text x="24" y="229" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">slot 2</text>
  <rect x="90" y="212" width="646" height="22" rx="5" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1"/>
  <rect x="90" y="212" width="78" height="22" rx="5" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1"/>
  <text x="128.76" y="228" font-size="11.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">2</text>
  <rect x="168" y="212" width="310" height="22" rx="5" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1"/>
  <text x="322.56" y="228" font-size="11.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">request 5</text>
  <rect x="478" y="212" width="258" height="22" rx="5" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1"/>
  <text x="606.8" y="228" font-size="11.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">request 8</text>
  <text x="24" y="255" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">slot 3</text>
  <rect x="90" y="238" width="646" height="22" rx="5" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1"/>
  <rect x="90" y="238" width="258" height="22" rx="5" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1"/>
  <text x="219.2" y="254" font-size="11.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">request 3</text>
  <rect x="348" y="238" width="388" height="22" rx="5" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1"/>
  <text x="542.2" y="254" font-size="11.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">request 7</text>
  <text x="24" y="281" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">slot 4</text>
  <rect x="90" y="264" width="646" height="22" rx="5" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1"/>
  <rect x="90" y="264" width="162" height="22" rx="5" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1"/>
  <text x="170.75" y="280" font-size="11.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">request 4</text>
  <rect x="252" y="264" width="368" height="22" rx="5" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1"/>
  <text x="435.61" y="280" font-size="11.5" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing="0">request 6</text>
  <text x="24" y="310" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Grey slots are empty. Under static batching, the green requests can only queue for the next batch</text>
  <text x="746" y="332" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
