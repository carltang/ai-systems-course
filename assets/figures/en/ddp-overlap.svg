<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 277" width="760" height="277" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="DDP: communicating while the backward pass runs">
  <title>DDP: communicating while the backward pass runs</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="277" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Time runs left to right: the backward pass goes from the last layer forward, and each bucket is sent once full</text>
  <text x="24" y="78" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">backward</text>
  <text x="24" y="134" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">Communication</text>
  <rect x="120" y="58" width="122" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="181.0" y="80.0" font-size="11.8" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">layers of bucket 1</text>
  <rect x="246" y="114" width="122" height="34" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="307.0" y="136.0" font-size="11.0" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">bucket 1 all-reduce</text>
  <rect x="246" y="58" width="122" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="307.0" y="80.0" font-size="11.8" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">layers of bucket 2</text>
  <rect x="372" y="114" width="122" height="34" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="433.0" y="136.0" font-size="11.0" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">bucket 2 all-reduce</text>
  <rect x="372" y="58" width="122" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="433.0" y="80.0" font-size="11.8" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">layers of bucket 3</text>
  <rect x="498" y="114" width="122" height="34" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="559.0" y="136.0" font-size="11.0" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">bucket 3 all-reduce</text>
  <rect x="498" y="58" width="122" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="559.0" y="80.0" font-size="11.8" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">layers of bucket 4</text>
  <rect x="624" y="114" width="122" height="34" rx="10" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="685.0" y="136.0" font-size="11.0" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">bucket 4 all-reduce</text>
  <line x1="622" y1="48" x2="622" y2="160" stroke="#d9d4c8" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="616" y="176" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">backward ends</text>
  <text x="628" y="176" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="628" dy="0">the last bucket is</tspan><tspan x="628" dy="17.5">exposed</tspan></text>
  <g transform="translate(0 17.5)"><text x="24" y="212" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">The green communication is hidden behind the backward computation; if communication is slower than the backward</tspan><tspan x="24" dy="17.5">pass, more is exposed</tspan></text></g>
  <text x="746" y="269" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
