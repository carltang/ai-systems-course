<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 242" width="760" height="242" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The troubleshooting loop">
  <title>The troubleshooting loop</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="242" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Every case follows the same loop</text>
  <rect x="24" y="56" width="160" height="60" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="104.0" y="82.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Expect first</text>
  <text x="104.0" y="103.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">work out the ceiling</text>
  <rect x="208" y="56" width="160" height="60" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="288.0" y="73.6" font-size="13.3" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Measure</text>
  <text x="288.0" y="91.6" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="288.0" dy="0">throughput, MFU, memory,</tspan><tspan x="288.0" dy="15.2">quality</tspan></text>
  <line x1="186" y1="86" x2="206" y2="86" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="392" y="56" width="160" height="60" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="472.0" y="73.6" font-size="13.3" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Judge the wait</text>
  <text x="472.0" y="91.6" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="472.0" dy="0">data, orders, compute,</tspan><tspan x="472.0" dy="15.2">other GPUs</tspan></text>
  <line x1="370" y1="86" x2="390" y2="86" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="576" y="56" width="160" height="60" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="656.0" y="82.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Change one thing</text>
  <text x="656.0" y="103.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">with the matching means</text>
  <line x1="554" y1="86" x2="574" y2="86" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <path d="M656 118 C 656 176, 300 176, 288 120" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="472" y="190" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">Measure again: solve one bottleneck, and the next surfaces</text>
  <text x="24" y="212" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Skipping the middle two steps and going straight to a means is the most common detour</text>
  <text x="746" y="234" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
