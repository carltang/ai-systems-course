<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="A per-layer factor after 50 layers">
  <title>A per-layer factor after 50 layers</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="230" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">The signal is multiplied by a factor at every layer; after 50 layers</text>
  <text x="24" y="78" font-size="14" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">× 1.5 each</text>
  <rect x="120" y="56" width="612" height="32" rx="7" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="132" y="77" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">grows about 600 million times: overflow</text>
  <text x="24" y="128" font-size="14" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">× 1 each</text>
  <rect x="120" y="106" width="300" height="32" rx="7" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="132" y="127" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">unchanged: passes through steadily</text>
  <text x="24" y="178" font-size="14" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">× 0.7 each</text>
  <rect x="120" y="156" width="26" height="32" rx="7" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="158" y="177" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">shrinks to 2 in 100 million: the signal becomes zero</text>
  <text x="746" y="222" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
