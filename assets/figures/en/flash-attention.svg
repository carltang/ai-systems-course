<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Flash Attention&#x27;s forward pass: tiling plus online softmax">
  <title>Flash Attention&#x27;s forward pass: tiling plus online softmax</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="316" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">In GPU memory: Q, K, V each cut into blocks</text>
  <rect x="24" y="50" width="38" height="30" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="43.0" y="70.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Q1</text>
  <rect x="540" y="50" width="46" height="30" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="563.0" y="70.0" font-size="10.1" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">K1 V1</text>
  <rect x="66" y="50" width="38" height="30" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="85.0" y="70.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Q2</text>
  <rect x="590" y="50" width="46" height="30" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="613.0" y="70.0" font-size="10.1" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">K2 V2</text>
  <rect x="108" y="50" width="38" height="30" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="127.0" y="70.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Q3</text>
  <rect x="640" y="50" width="46" height="30" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="663.0" y="70.0" font-size="10.1" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">K3 V3</text>
  <rect x="150" y="50" width="38" height="30" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="169.0" y="70.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Q4</text>
  <rect x="690" y="50" width="46" height="30" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="713.0" y="70.0" font-size="10.1" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">K4 V4</text>
  <rect x="150" y="116" width="460" height="130" rx="14" fill="#ffffff" stroke="#8aa2e6" stroke-width="1.4"/>
  <text x="168" y="138" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">one SM&#x27;s on-chip storage</text>
  <rect x="170" y="152" width="100" height="44" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="220.0" y="170.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">a block of Q</text>
  <text x="220.0" y="191.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">outer loop</text>
  <rect x="290" y="152" width="100" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="340.0" y="170.0" font-size="11.9" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">a block of K, V</text>
  <text x="340.0" y="191.0" font-size="11.0" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">inner loop</text>
  <rect x="410" y="152" width="180" height="44" rx="10" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="500.0" y="170.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">this block&#x27;s scores</text>
  <text x="500.0" y="191.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">used, then discarded</text>
  <rect x="170" y="204" width="420" height="34" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="380.0" y="224.6" font-size="11.0" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">three running values: maximum, sum of exponentials, unnormalised output</text>
  <path d="M85 82 C 85 130, 120 174, 168 174" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <path d="M655 82 C 655 124, 440 104, 344 150" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="24" y="272" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">Only after a block of Q has seen all of K, V is its output written to GPU memory: the N×N matrix never appears at all</text>
  <text x="746" y="308" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
