<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" width="760" height="334" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The four waits, classified">
  <title>The four waits, classified</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="334" rx="14" fill="#fbf9f4"/>
  <rect x="290" y="22" width="180" height="46" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="380.0" y="40.8" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"><tspan x="380.0" dy="0">What is the GPU doing</tspan><tspan x="380.0" dy="17.5">during this time?</tspan></text>
  <rect x="70" y="104" width="250" height="46" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="195.0" y="123.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Not working</text>
  <text x="195.0" y="144.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">utilisation below 100%</text>
  <rect x="440" y="104" width="250" height="46" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="565.0" y="123.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Working, but not fast enough</text>
  <text x="565.0" y="144.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">utilisation may show 100%</text>
  <line x1="340" y1="70" x2="230" y2="102" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="420" y1="70" x2="530" y2="102" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="24" y="196" width="118" height="80" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="83.0" y="216.1" font-size="13.3" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Waiting for data</text>
  <text x="83.0" y="234.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="83.0" dy="0">storage,</tspan><tspan x="83.0" dy="15.2">preprocessing,</tspan><tspan x="83.0" dy="15.2">copies</tspan></text>
  <line x1="195" y1="152" x2="83" y2="194" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="154" y="196" width="118" height="80" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="213.0" y="215.3" font-size="13.3" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"><tspan x="213.0" dy="0">Waiting for</tspan><tspan x="213.0" dy="16.6">orders</tspan></text>
  <text x="213.0" y="249.9" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="213.0" dy="0">Python, framework</tspan><tspan x="213.0" dy="15.2">too slow</tspan></text>
  <line x1="195" y1="152" x2="213" y2="194" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="284" y="196" width="118" height="80" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="343.0" y="215.3" font-size="13.3" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"><tspan x="343.0" dy="0">Waiting for</tspan><tspan x="343.0" dy="16.6">other GPUs</tspan></text>
  <text x="343.0" y="249.9" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="343.0" dy="0">syncing gradients,</tspan><tspan x="343.0" dy="15.2">network</tspan></text>
  <line x1="195" y1="152" x2="343" y2="194" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="440" y="196" width="118" height="80" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="499.0" y="232.0" font-size="12.8" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Compute-bound</text>
  <text x="499.0" y="253.0" font-size="11.0" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">arithmetic units busy</text>
  <rect x="572" y="196" width="118" height="80" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="631.0" y="231.7" font-size="11.3" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Bandwidth-bound</text>
  <text x="631.0" y="247.4" font-size="9.8" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">waiting on memory</text>
  <line x1="565" y1="152" x2="499" y2="194" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="565" y1="152" x2="631" y2="194" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="565" y="300" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">Together these two are &quot;waiting on compute&quot;</text>
  <text x="746" y="326" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
