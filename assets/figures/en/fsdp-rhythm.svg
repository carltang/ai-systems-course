<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" width="760" height="252" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="FSDP: assemble a layer in full only when it is used">
  <title>FSDP: assemble a layer in full only when it is used</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="252" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">One layer&#x27;s rhythm in a training step (normally each GPU stores only 1/N of it)</text>
  <text x="24" y="76" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">forward</text>
  <text x="24" y="140" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">backward</text>
  <rect x="90" y="54" width="144" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="162.0" y="72.0" font-size="11.4" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">all-gather</text>
  <text x="162.0" y="93.0" font-size="11.0" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">assemble full parameters</text>
  <rect x="240" y="54" width="164" height="44" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="322.0" y="81.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">this layer&#x27;s forward</text>
  <rect x="410" y="54" width="144" height="44" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="482.0" y="72.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">free</text>
  <text x="482.0" y="93.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">keep only its own 1/N</text>
  <rect x="90" y="118" width="124" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="152.0" y="136.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">all-gather</text>
  <text x="152.0" y="157.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">assemble again</text>
  <rect x="220" y="118" width="164" height="44" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="302.0" y="136.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">this layer&#x27;s backward</text>
  <text x="302.0" y="157.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">get full gradients</text>
  <rect x="390" y="118" width="154" height="44" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="467.0" y="136.0" font-size="12.2" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">reduce-scatter</text>
  <text x="467.0" y="157.0" font-size="11.8" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">sum gradients and cut up</text>
  <rect x="550" y="118" width="94" height="44" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="597.0" y="145.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">free</text>
  <text x="24" y="196" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">Peak memory ≈ its own 1/N of model state + the full parameters of the one or two layers in use + activations</text>
  <text x="24" y="216" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Send the next layer&#x27;s all-gather early (prefetch), and it hides behind the current layer&#x27;s computation</text>
  <text x="746" y="244" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
