<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The scheduler&#x27;s two steps">
  <title>The scheduler&#x27;s two steps</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="266" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">The scheduler picks a node for a Pod: filter first, then score</text>
  <rect x="24" y="60" width="130" height="60" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="89.0" y="86.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Pod</text>
  <text x="89.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">requests, labels</text>
  <rect x="200" y="60" width="180" height="60" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="290.0" y="86.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Filter</text>
  <text x="290.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">rule out unusable nodes</text>
  <rect x="426" y="60" width="150" height="60" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="501.0" y="86.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Score</text>
  <text x="501.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">highest of the rest</text>
  <rect x="622" y="60" width="114" height="60" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="679.0" y="86.0" font-size="12.7" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Bind to node</text>
  <text x="679.0" y="107.0" font-size="11.8" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">kubelet takes over</text>
  <line x1="156" y1="90" x2="198" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="382" y1="90" x2="424" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="578" y1="90" x2="620" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="290" y="140" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">not enough resources, labels don&#x27;t match</text>
  <text x="290" y="158" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">untolerated taints, volumes can&#x27;t mount</text>
  <text x="24" y="196" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">It looks at one Pod at a time, and only at whether there is enough: it does not know which Pods are one job, which talk a</tspan><tspan x="24" dy="17.5">lot, or whether GPUs and cores are on the same side</tspan></text>
  <g transform="translate(0 17.5)"><text x="24" y="216" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">These three need the gang scheduling, topology awareness and kubelet Topology Manager of 8.2</text></g>
  <text x="746" y="258" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
