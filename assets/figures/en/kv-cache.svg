<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="KV cache: a new position needs only the K and V of earlier positions">
  <title>KV cache: a new position needs only the K and V of earlier positions</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="266" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Attention in one layer, while generating token 5</text>
  <rect x="60" y="58" width="92" height="36" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="106.0" y="79.6" font-size="11.0" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">K of position 1</text>
  <rect x="60" y="100" width="92" height="36" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="106.0" y="121.6" font-size="11.0" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">V of position 1</text>
  <rect x="170" y="58" width="92" height="36" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="216.0" y="79.6" font-size="11.0" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">K of position 2</text>
  <rect x="170" y="100" width="92" height="36" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="216.0" y="121.6" font-size="11.0" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">V of position 2</text>
  <rect x="280" y="58" width="92" height="36" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="326.0" y="79.6" font-size="11.0" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">K of position 3</text>
  <rect x="280" y="100" width="92" height="36" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="326.0" y="121.6" font-size="11.0" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">V of position 3</text>
  <rect x="390" y="58" width="92" height="36" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="436.0" y="79.6" font-size="11.0" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">K of position 4</text>
  <rect x="390" y="100" width="92" height="36" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="436.0" y="121.6" font-size="11.0" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">V of position 4</text>
  <rect x="48" y="48" width="446" height="98" rx="12" fill="none" stroke="#d9d4c8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="271" y="168" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">KV cache: computed before, kept, not recomputed</text>
  <rect x="560" y="58" width="176" height="36" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="648.0" y="81.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">new position&#x27;s Q</text>
  <rect x="560" y="100" width="176" height="36" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="648.0" y="114.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">new K, V</text>
  <text x="648.0" y="135.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">appended to the cache</text>
  <line x1="558" y1="76" x2="496" y2="76" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="527.0" y="69.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">look up</text>
  <line x1="558" y1="118" x2="496" y2="118" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="527.0" y="111.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">append</text>
  <text x="24" y="206" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Each step really computes only this last position; the earlier positions&#x27; Q and other intermediate results are not needed</text>
  <text x="24" y="228" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">The cost: one copy per layer per concurrent request, growing with the context</text>
  <text x="746" y="258" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
