<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 283" width="760" height="283" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The size of the KV cache">
  <title>The size of the KV cache</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="283" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">A model with 32 layers, hidden dimension 4096, stored in 16 bits: how large is the KV cache?</text>
  <text x="24" y="74" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">model weights</text>
  <rect x="190" y="54" width="118" height="28" rx="6" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="319.6" y="73" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">14 GB</text>
  <text x="24" y="112" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">per token</text>
  <rect x="190" y="92" width="4" height="28" rx="6" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="206" y="111" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">about 0.5 MB</text>
  <text x="24" y="150" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">a 4000-token chat</text>
  <rect x="190" y="130" width="17" height="28" rx="6" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="218.8" y="149" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">about 2 GB</text>
  <text x="24" y="188" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">a 100k-token document</text>
  <rect x="190" y="168" width="420" height="28" rx="6" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="622.0" y="187" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="622.0" dy="0">about 50 GB, more</tspan><tspan x="622.0" dy="17.5">than the weights</tspan></text>
  <g transform="translate(0 17.5)"><text x="24" y="218" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">Every concurrent request needs its own; it grows with sequence length and concurrency, and is the bulk of inference</tspan><tspan x="24" dy="17.5">memory</tspan></text></g>
  <text x="746" y="275" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
