<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" width="760" height="388" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Six layers of the same pipeline">
  <title>Six layers of the same pipeline</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="388" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">The same line y = model(x), described in a different language at each layer down</text>
  <rect x="24" y="54" width="712" height="42" rx="9" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="48" y="81" font-size="15" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">Algorithm</text>
  <text x="170" y="81" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">What is computed: matrix multiplication, attention, normalisation</text>
  <text x="716" y="81" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">Parts 1, 10</text>
  <rect x="24" y="106" width="712" height="42" rx="9" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="48" y="133" font-size="15" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">Framework</text>
  <text x="170" y="133" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">How Python becomes a stream of GPU tasks</text>
  <text x="716" y="133" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">Part 2</text>
  <rect x="24" y="158" width="712" height="42" rx="9" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="48" y="185" font-size="15" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">Operators</text>
  <text x="170" y="185" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">How to write a kernel that runs fast</text>
  <text x="716" y="185" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">Part 4</text>
  <rect x="24" y="210" width="712" height="42" rx="9" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="48" y="237" font-size="15" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">Hardware</text>
  <text x="170" y="237" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">How the GPU actually executes the threads</text>
  <text x="716" y="237" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">Part 3</text>
  <rect x="24" y="262" width="712" height="42" rx="9" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="48" y="289" font-size="15" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">Communication</text>
  <text x="170" y="289" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">How many GPUs exchange data</text>
  <text x="716" y="289" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">Parts 5–7</text>
  <rect x="24" y="314" width="712" height="42" rx="9" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="48" y="341" font-size="15" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">Cluster</text>
  <text x="170" y="341" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">How jobs queue, and which machines they land on</text>
  <text x="716" y="341" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">Part 8</text>
  <text x="746" y="380" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
