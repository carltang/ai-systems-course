<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The four layers of NCCL&#x27;s choices">
  <title>The four layers of NCCL&#x27;s choices</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="296" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">The four layers of choices behind one collective operation</text>
  <rect x="24" y="50" width="186" height="40" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="117.0" y="66.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Algorithm</text>
  <text x="117.0" y="87.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">the path between GPUs</text>
  <rect x="224" y="54" width="164" height="32" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="306.0" y="75.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">ring: best bandwidth</text>
  <rect x="396" y="54" width="164" height="32" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="478.0" y="75.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">tree: fewest steps</text>
  <rect x="568" y="54" width="164" height="32" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="650.0" y="75.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">hardware-specific</text>
  <rect x="24" y="100" width="186" height="40" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="117.0" y="116.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Protocol</text>
  <text x="117.0" y="137.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">when data is valid</text>
  <rect x="224" y="104" width="164" height="32" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="306.0" y="125.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Simple: for bandwidth</text>
  <rect x="396" y="104" width="164" height="32" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="478.0" y="125.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">LL: for low latency</text>
  <rect x="568" y="104" width="164" height="32" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="650.0" y="125.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">LL128: for both</text>
  <rect x="24" y="150" width="186" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="117.0" y="166.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Channels</text>
  <text x="117.0" y="187.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">parallel streams</text>
  <rect x="224" y="154" width="164" height="32" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="306.0" y="175.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">one SM per stream</text>
  <rect x="396" y="154" width="164" height="32" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="478.0" y="175.0" font-size="11.8" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">fewer for small messages</text>
  <rect x="24" y="200" width="186" height="40" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="117.0" y="216.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Transport</text>
  <text x="117.0" y="237.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">the road per GPU pair</text>
  <rect x="224" y="204" width="164" height="32" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="306.0" y="225.0" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">inside: P2P, SHM</text>
  <rect x="396" y="204" width="164" height="32" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="478.0" y="225.0" font-size="11.0" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">across: IB verbs or socket</text>
  <text x="24" y="264" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Topology, rings, trees and connections are fixed once at initialisation and never change; all of it is logged</text>
  <text x="746" y="288" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
