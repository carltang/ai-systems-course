<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="NUMA: the process and the device on different sides">
  <title>NUMA: the process and the device on different sides</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="296" rx="14" fill="#fbf9f4"/>
  <rect x="24" y="46" width="336" height="150" rx="12" fill="none" stroke="#d9d4c8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="36" y="38" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">NUMA node 0</text>
  <rect x="40" y="62" width="140" height="44" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="110.0" y="89.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">CPU socket 0</text>
  <rect x="204" y="62" width="140" height="44" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="274.0" y="89.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">memory</text>
  <rect x="400" y="46" width="336" height="150" rx="12" fill="none" stroke="#d9d4c8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="412" y="38" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">NUMA node 1</text>
  <rect x="416" y="62" width="140" height="44" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="486.0" y="89.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">CPU socket 1</text>
  <rect x="580" y="62" width="140" height="44" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="650.0" y="89.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">memory</text>
  <rect x="40" y="136" width="180" height="44" rx="10" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="130.0" y="154.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">DataLoader process</text>
  <text x="130.0" y="175.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">scheduled onto this side</text>
  <rect x="580" y="136" width="140" height="44" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="650.0" y="154.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">GPU 3</text>
  <text x="650.0" y="175.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">attached on this side</text>
  <path d="M222 158 C 330 158, 330 120, 380 120 S 470 158, 578 158" fill="none" stroke="#dc97a3" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="380" y="214" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">every batch has to cross the link between the sockets</text>
  <text x="24" y="244" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">The rule for placement: the GPU a process uses decides the side its CPU cores and memory should be on</text>
  <text x="24" y="264" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">When several GPUs are misplaced at once, the link between the sockets becomes the bottleneck</text>
  <text x="746" y="288" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
