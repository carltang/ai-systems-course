<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" width="760" height="248" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The five layers one operator call passes through">
  <title>The five layers one operator call passes through</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="248" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">The five layers c = torch.add(a, b) passes through from Python to the GPU</text>
  <rect x="24" y="54" width="128" height="62" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="88.0" y="71.5" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Python binding</text>
  <text x="88.0" y="90.6" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="88.0" dy="0">parse arguments,</tspan><tspan x="88.0" dy="16.5">release the GIL</tspan></text>
  <rect x="170" y="54" width="128" height="62" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="234.0" y="71.5" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">dispatcher</text>
  <text x="234.0" y="90.6" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="234.0" dy="0">pick the next stop</tspan><tspan x="234.0" dy="16.5">by priority</tspan></text>
  <line x1="154" y1="85" x2="168" y2="85" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="316" y="54" width="128" height="62" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="380.0" y="71.5" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">autograd layer</text>
  <text x="380.0" y="90.6" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="380.0" dy="0">create the</tspan><tspan x="380.0" dy="16.5">backward node</tspan></text>
  <line x1="300" y1="85" x2="314" y2="85" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="462" y="54" width="128" height="62" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="526.0" y="81.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">backend</text>
  <text x="526.0" y="102.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">allocate, prepare</text>
  <line x1="446" y1="85" x2="460" y2="85" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="608" y="54" width="128" height="62" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="672.0" y="81.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">CUDA</text>
  <text x="672.0" y="102.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">kernel queued</text>
  <line x1="592" y1="85" x2="606" y2="85" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="24" y="138" width="566" height="6" rx="3" fill="#a892dc"/>
  <text x="307.0" y="164" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">All on the CPU, single-threaded; the time taken does not depend on tensor size</text>
  <rect x="608" y="138" width="128" height="6" rx="3" fill="#8aa2e6"/>
  <text x="672.0" y="164" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">the GPU runs it later</text>
  <text x="24" y="208" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Every operator goes through all of it: with many small operators, this fixed overhead is the bottleneck (waiting for orders)</text>
  <text x="746" y="240" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
