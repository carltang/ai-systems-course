<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Overlap slows the compute but shortens the step">
  <title>Overlap slows the compute but shortens the step</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="266" rx="14" fill="#fbf9f4"/>
  <text x="24" y="32" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">One training step, time running left to right (illustrative numbers)</text>
  <text x="24" y="84" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">Serial</text>
  <rect x="128.0" y="64" width="380.0" height="38" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="318.0" y="88.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Backward 100 ms</text>
  <rect x="508.0" y="64" width="152.0" height="38" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="584.0" y="88.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Comm. 40 ms</text>
  <text x="24" y="166" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">Overlapped</text>
  <rect x="128.0" y="136" width="418.0" height="38" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="337.0" y="160.0" font-size="12.2" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Backward 110 ms: communication takes some SMs, 10% slower</text>
  <rect x="280.0" y="180" width="266.0" height="24" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="413.0" y="197.0" font-size="11.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Communication hidden behind compute</text>
  <rect x="546.0" y="180" width="38.0" height="24" rx="10" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="565.0" y="197.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <text x="592.0" y="197" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Last bucket: 10 ms</text>
  <line x1="660.0" y1="56" x2="660.0" y2="112" stroke="#2b303b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="666.0" y="68" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">Step 140 ms</text>
  <line x1="584.0" y1="128" x2="584.0" y2="212" stroke="#2b303b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="590.0" y="140" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">Step 120 ms</text>
  <text x="24" y="238" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">Compute kernels alone got slower; the step is 20 ms shorter, so throughput and MFU both rise</text>
  <text x="746" y="258" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
