<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Managing the KV cache in pages">
  <title>Managing the KV cache in pages</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="296" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Each request believes its cache is contiguous</text>
  <text x="736" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">In GPU memory: fixed-size blocks, placed wherever there is room</text>
  <text x="24" y="82" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">request A</text>
  <rect x="90" y="60" width="44" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="112.0" y="82.0" font-size="12" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">#0</text>
  <rect x="138" y="60" width="44" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="160.0" y="82.0" font-size="12" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">#1</text>
  <rect x="186" y="60" width="44" height="34" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="208.0" y="82.0" font-size="12" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">#2</text>
  <rect x="234" y="60" width="44" height="34" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="256.0" y="82.0" font-size="12" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">…</text>
  <text x="24" y="162" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing="0">request B</text>
  <rect x="90" y="140" width="44" height="34" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="112.0" y="162.0" font-size="12" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">#0</text>
  <rect x="138" y="140" width="44" height="34" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="160.0" y="162.0" font-size="12" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">#1</text>
  <rect x="186" y="140" width="44" height="34" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="208.0" y="162.0" font-size="12" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">…</text>
  <rect x="330" y="78" width="110" height="78" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="385.0" y="103.5" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">page table</text>
  <text x="385.0" y="122.6" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="385.0" dy="0">logical block →</tspan><tspan x="385.0" dy="16.5">physical block</tspan></text>
  <rect x="520" y="66" width="50" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="545.0" y="91.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <rect x="574" y="66" width="50" height="40" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="599.0" y="91.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <rect x="628" y="66" width="50" height="40" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="653.0" y="91.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <rect x="682" y="66" width="50" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="707.0" y="91.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <rect x="520" y="116" width="50" height="40" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="545.0" y="141.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <rect x="574" y="116" width="50" height="40" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="599.0" y="141.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <rect x="628" y="116" width="50" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="653.0" y="141.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <rect x="682" y="116" width="50" height="40" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="707.0" y="141.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <line x1="284" y1="80" x2="328" y2="104" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="240" y1="160" x2="328" y2="130" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="442" y1="117" x2="516" y2="110" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="628" y="186" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">grey: free blocks</text>
  <text x="24" y="232" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">Allocate only what is used: no need to reserve for the maximum length, nor to copy whole blocks as it grows</text>
  <text x="24" y="254" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">When two requests share a prefix, their page tables can point to the same blocks, stored only once</text>
  <text x="746" y="288" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
