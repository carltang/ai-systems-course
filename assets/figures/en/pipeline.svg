<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" width="760" height="278" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The pipeline of one training step, and the four waits">
  <title>The pipeline of one training step, and the four waits</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="278" rx="14" fill="#fbf9f4"/>
  <text x="24" y="36" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">One training step passes through these, left to right</text>
  <rect x="24" y="70" width="104" height="64" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="76.0" y="98.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">1 Load data</text>
  <text x="76.0" y="119.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">storage → CPU</text>
  <rect x="146" y="70" width="104" height="64" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="198.0" y="98.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">2 Batch up</text>
  <text x="198.0" y="119.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">pinned memory</text>
  <line x1="130" y1="102" x2="144" y2="102" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="268" y="70" width="104" height="64" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="320.0" y="98.0" font-size="11.9" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">3 Copy to GPU</text>
  <text x="320.0" y="119.0" font-size="11.0" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">PCIe</text>
  <line x1="252" y1="102" x2="266" y2="102" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="390" y="70" width="104" height="64" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="442.0" y="98.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">4 Fwd · bwd</text>
  <text x="442.0" y="119.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">GPU</text>
  <line x1="374" y1="102" x2="388" y2="102" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="512" y="70" width="104" height="64" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="564.0" y="98.0" font-size="11.9" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">5 Sync grads</text>
  <text x="564.0" y="119.0" font-size="11.0" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">NVLink / network</text>
  <line x1="496" y1="102" x2="510" y2="102" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="634" y="70" width="104" height="64" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="686.0" y="98.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">6 Optimizer</text>
  <text x="686.0" y="119.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">GPU</text>
  <line x1="618" y1="102" x2="632" y2="102" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="24" y="158" width="348" height="6" rx="3" fill="#e0b860"/>
  <text x="198.0" y="182" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">waiting for data</text>
  <rect x="390" y="158" width="104" height="6" rx="3" fill="#8aa2e6"/>
  <text x="442.0" y="182" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">on compute</text>
  <rect x="512" y="158" width="104" height="6" rx="3" fill="#7fbf99"/>
  <text x="564.0" y="182" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">for other GPUs</text>
  <rect x="634" y="158" width="104" height="6" rx="3" fill="#8aa2e6"/>
  <text x="686.0" y="182" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">on compute</text>
  <rect x="390" y="206" width="348" height="6" rx="3" fill="#a892dc"/>
  <text x="564.0" y="230" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"><tspan x="564.0" dy="0">waiting for orders: Python on the CPU can&#x27;t hand the GPU</tspan><tspan x="564.0" dy="17.5">its next task in time</tspan></text>
  <text x="746" y="270" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
