<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 254" width="760" height="254" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Quantisation is switching to a ruler with coarser markings">
  <title>Quantisation is switching to a ruler with coarser markings</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="254" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">The range −0.8 to +0.8 divided into equal steps (only 16 drawn here)</text>
  <line x1="60" y1="110" x2="700" y2="110" stroke="#2b303b" stroke-width="1.4"/>
  <line x1="60.0" y1="101" x2="60.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="100.0" y1="101" x2="100.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="140.0" y1="101" x2="140.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="180.0" y1="101" x2="180.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="220.0" y1="101" x2="220.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="260.0" y1="101" x2="260.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="300.0" y1="101" x2="300.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="340.0" y1="101" x2="340.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="380.0" y1="101" x2="380.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="420.0" y1="101" x2="420.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="460.0" y1="101" x2="460.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="500.0" y1="101" x2="500.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="540.0" y1="101" x2="540.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="580.0" y1="101" x2="580.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="620.0" y1="101" x2="620.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="660.0" y1="101" x2="660.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <line x1="700.0" y1="101" x2="700.0" y2="119" stroke="#2b303b" stroke-width="1.2"/>
  <text x="60" y="140" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">−0.8</text>
  <text x="380.0" y="140" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">0</text>
  <text x="700" y="140" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">+0.8</text>
  <circle cx="473.6" cy="84" r="5.5" fill="#8aa2e6"/>
  <circle cx="460" cy="110" r="5.5" fill="#e0b860"/>
  <line x1="471.6" y1="90" x2="464" y2="104" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="485.6" y="88" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">the original numbers</text>
  <text x="450" y="94" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="end" letter-spacing="0">store the nearest marking</text>
  <text x="24" y="176" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">The error is at most half a step. Step width is range ÷ number of steps: either use more bits (more steps) or find a way to</tspan><tspan x="24" dy="17.5">shrink the range</tspan></text>
  <g transform="translate(0 17.5)"><text x="24" y="198" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">8 bits give 256 steps, 4 bits only 16</text></g>
  <text x="746" y="246" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
