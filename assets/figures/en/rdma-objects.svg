<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The four things of RDMA">
  <title>The four things of RDMA</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="302" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">application (user space)</text>
  <text x="736" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">NIC</text>
  <rect x="24" y="52" width="220" height="60" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="134.0" y="78.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Memory region MR</text>
  <text x="134.0" y="99.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">pinned and registered with the NIC</text>
  <rect x="24" y="132" width="220" height="60" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="134.0" y="158.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Work request WR</text>
  <text x="134.0" y="179.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">a ticket: which memory, how long</text>
  <rect x="300" y="132" width="200" height="60" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="400.0" y="158.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Queue pair QP</text>
  <text x="400.0" y="179.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">send queue + receive queue</text>
  <rect x="300" y="52" width="200" height="60" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="400.0" y="78.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Completion queue CQ</text>
  <text x="400.0" y="99.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">one record per finished ticket</text>
  <rect x="566" y="92" width="170" height="60" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="651.0" y="118.0" font-size="12.3" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">NIC hardware</text>
  <text x="651.0" y="139.0" font-size="11.0" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">reliable delivery is done here</text>
  <line x1="246" y1="162" x2="298" y2="162" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="272.0" y="155.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">post</text>
  <line x1="502" y1="150" x2="564" y2="130" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="564" y1="112" x2="502" y2="84" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="298" y1="82" x2="246" y2="100" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="272.0" y="81.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">poll</text>
  <text x="24" y="228" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">Registering memory and setting up connections are slow, done at start-up; after that every send and receive avoids the</tspan><tspan x="24" dy="17.5">kernel, copies and interrupts</tspan></text>
  <g transform="translate(0 17.5)"><text x="24" y="248" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Two keys: lkey for yourself, rkey for the peer, who needs it to read and write this memory directly</text></g>
  <text x="746" y="294" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
