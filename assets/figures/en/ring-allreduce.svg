<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Ring all-reduce and each GPU&#x27;s traffic">
  <title>Ring all-reduce and each GPU&#x27;s traffic</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="310" rx="14" fill="#fbf9f4"/>
  <line x1="134.8456710674493" y1="94.84567106744929" x2="165.1543289325507" y2="94.8456710674493" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="205.1543289325507" y1="120.8456710674493" x2="205.1543289325507" y2="179.1543289325507" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="165.1543289325507" y1="205.1543289325507" x2="134.8456710674493" y2="205.1543289325507" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="94.8456710674493" y1="179.1543289325507" x2="94.8456710674493" y2="120.84567106744929" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="58.8456710674493" y="74.84567106744929" width="72" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="94.8456710674493" y="99.84567106744929" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">GPU 0</text>
  <rect x="169.1543289325507" y="74.8456710674493" width="72" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="205.1543289325507" y="99.8456710674493" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">GPU 1</text>
  <rect x="169.1543289325507" y="185.1543289325507" width="72" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="205.1543289325507" y="210.1543289325507" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">GPU 2</text>
  <rect x="58.8456710674493" y="185.1543289325507" width="72" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="94.8456710674493" y="210.1543289325507" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">GPU 3</text>
  <text x="150" y="146" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">each talks only</text>
  <text x="150" y="164" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">to the next</text>
  <text x="150" y="262" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="150" dy="0">First half: add as you pass; second half: pass</tspan><tspan x="150" dy="17.5">without adding; N−1 steps each</tspan></text>
  <text x="330" y="44" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">How much data each GPU sends in all: 2(N−1)/N</text>
  <text x="330" y="84" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">2 GPUs</text>
  <rect x="404" y="64" width="130" height="30" rx="6" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="544.0" y="84" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">1 copy</text>
  <text x="330" y="128" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">4 GPUs</text>
  <rect x="404" y="108" width="195" height="30" rx="6" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="609.0" y="128" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">1.5 copies</text>
  <text x="330" y="172" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">8 GPUs</text>
  <rect x="404" y="152" width="228" height="30" rx="6" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="641.5" y="172" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">1.75 copies</text>
  <text x="330" y="216" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">more</text>
  <rect x="404" y="196" width="260" height="30" rx="6" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="674.0" y="216" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">→ 2 copies</text>
  <text x="330" y="252" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">From 2 GPUs to thousands, each GPU&#x27;s traffic at most doubles</text>
  <text x="746" y="302" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
