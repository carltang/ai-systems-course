<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The basic loop of reinforcement learning">
  <title>The basic loop of reinforcement learning</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="266" rx="14" fill="#fbf9f4"/>
  <rect x="90" y="86" width="200" height="78" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="190.0" y="121.0" font-size="13.2" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Agent</text>
  <text x="190.0" y="142.0" font-size="11.0" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">policy: sees a state, picks an action</text>
  <rect x="470" y="86" width="200" height="78" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="570.0" y="121.0" font-size="13.2" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Environment</text>
  <text x="570.0" y="142.0" font-size="11.0" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">a game, a simulator, the real world</text>
  <path d="M290 104 C 350 60, 410 60, 470 104" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="380" y="58" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">action a</text>
  <path d="M470 146 C 410 196, 350 196, 290 146" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="380" y="212" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">new state s′ and reward r</text>
  <text x="380" y="130" font-size="12" fill="#9aa0aa" font-weight="400" text-anchor="middle" letter-spacing="0">many times over</text>
  <text x="380" y="238" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">The goal: as much reward as possible accumulated over the whole process, not at any one step</text>
  <text x="746" y="258" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
