<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The two routes of reinforcement learning">
  <title>The two routes of reinforcement learning</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="306" rx="14" fill="#fbf9f4"/>
  <rect x="280" y="20" width="200" height="52" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="380.0" y="42.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Temporal difference (TD)</text>
  <text x="380.0" y="63.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">update toward the next step</text>
  <rect x="40" y="116" width="250" height="62" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="165.0" y="143.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Value route</text>
  <text x="165.0" y="164.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">learn Q(s, a), take the best action</text>
  <rect x="470" y="116" width="250" height="62" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="595.0" y="143.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Policy route</text>
  <text x="595.0" y="164.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">directly raise good actions&#x27; probability</text>
  <rect x="255" y="212" width="250" height="58" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="380.0" y="237.0" font-size="13.2" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">actor-critic → PPO</text>
  <text x="380.0" y="258.0" font-size="11.8" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">critic scores, actor improves; small steps</text>
  <line x1="350" y1="74" x2="252" y2="114" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="165" y1="180" x2="300" y2="214" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="198.5" y="207.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">DQN</text>
  <line x1="595" y1="180" x2="460" y2="214" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="579.5" y="207.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">REINFORCE</text>
  <line x1="430" y1="74" x2="440" y2="210" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#tip)"/>
  <text x="40" y="104" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">few discrete actions; old data reusable</text>
  <text x="720" y="104" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">any actions; only freshly produced data</text>
  <text x="746" y="298" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
