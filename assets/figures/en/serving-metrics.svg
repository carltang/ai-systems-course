<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The three metrics of an inference service">
  <title>The three metrics of an inference service</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="236" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">One request, from arrival to finish</text>
  <rect x="24" y="60" width="110" height="44" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="79.0" y="87.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">queueing</text>
  <rect x="140" y="60" width="170" height="44" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="225.0" y="78.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">prefill</text>
  <text x="225.0" y="99.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">reading the prompt</text>
  <rect x="322" y="60" width="40" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="342.0" y="87.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <rect x="380" y="60" width="40" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="400.0" y="87.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <rect x="438" y="60" width="40" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="458.0" y="87.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <rect x="496" y="60" width="40" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="516.0" y="87.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <rect x="554" y="60" width="40" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="574.0" y="87.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <rect x="612" y="60" width="40" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="632.0" y="87.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <rect x="670" y="60" width="40" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="690.0" y="87.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0"></text>
  <text x="532" y="126" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">output tokens one by one</text>
  <rect x="24" y="140" width="318" height="6" rx="3" fill="#8aa2e6"/>
  <text x="183" y="166" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">time to first token (TTFT)</text>
  <rect x="380" y="140" width="58" height="6" rx="3" fill="#e0b860"/>
  <text x="409" y="166" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">time per token</text>
  <text x="409" y="184" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">(TPOT)</text>
  <text x="24" y="206" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Total time ≈ TTFT + output tokens × TPOT; throughput is the tokens the whole system generates per second</text>
  <text x="746" y="228" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
