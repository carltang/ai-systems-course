<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" width="760" height="248" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Tiling at several levels">
  <title>Tiling at several levels</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="248" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Every level of storage does the same thing: bring a block in, and use it many times there</text>
  <rect x="24" y="58" width="158" height="64" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="103.0" y="86.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">GPU memory</text>
  <text x="103.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">the whole matrix</text>
  <rect x="208" y="58" width="158" height="64" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="287.0" y="86.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Shared memory</text>
  <text x="287.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">a block brings in a tile</text>
  <line x1="184" y1="90" x2="206" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="392" y="58" width="158" height="64" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="471.0" y="76.7" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Registers</text>
  <text x="471.0" y="95.9" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="471.0" dy="0">warps and threads each</tspan><tspan x="471.0" dy="16.5">take a slice</tspan></text>
  <line x1="368" y1="90" x2="390" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="576" y="58" width="158" height="64" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="655.0" y="76.7" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Tensor Core</text>
  <text x="655.0" y="95.9" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="655.0" dy="0">one instruction does a</tspan><tspan x="655.0" dy="16.5">small matmul</tspan></text>
  <line x1="552" y1="90" x2="574" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="24" y="158" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">far, large, slow</text>
  <text x="736" y="158" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">near, small, fast</text>
  <line x1="132" y1="154" x2="628" y2="154" stroke="#d9d4c8" stroke-width="1.2" marker-end="url(#tip)"/>
  <text x="24" y="206" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Reading high-performance matmul code: first recognise which level of storage each loop corresponds to</text>
  <text x="746" y="240" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
