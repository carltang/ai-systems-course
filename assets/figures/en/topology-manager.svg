<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 274" width="760" height="274" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The Topology Manager">
  <title>The Topology Manager</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="274" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">In the kubelet three parties each manage one resource, by default each going its own way</text>
  <rect x="24" y="52" width="220" height="42" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="134.0" y="69.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">CPU Manager</text>
  <text x="134.0" y="90.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">allocates specific CPU cores</text>
  <line x1="246" y1="73" x2="328" y2="100" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="24" y="104" width="220" height="42" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="134.0" y="121.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Memory Manager</text>
  <text x="134.0" y="142.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">picks the NUMA node</text>
  <line x1="246" y1="125" x2="328" y2="110" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="24" y="156" width="220" height="42" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="134.0" y="173.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Device Manager</text>
  <text x="134.0" y="194.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">allocates specific GPUs and NICs</text>
  <line x1="246" y1="177" x2="328" y2="120" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="330" y="84" width="170" height="62" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="415.0" y="111.0" font-size="12.8" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">The Topology Manager</text>
  <text x="415.0" y="132.0" font-size="11.0" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">intersect</text>
  <text x="415" y="70" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">each reports: on which sides I can satisfy it</text>
  <rect x="566" y="84" width="170" height="62" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="651.0" y="101.5" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">allocate by the result</text>
  <text x="651.0" y="120.6" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0"><tspan x="651.0" dy="0">cores, memory, GPUs on</tspan><tspan x="651.0" dy="16.5">one side</tspan></text>
  <line x1="502" y1="115" x2="564" y2="115" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="24" y="226" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="24" dy="0">The policy is set by the administrator on the kubelet, none (no coordination) by default; when alignment fails, strict policies</tspan><tspan x="24" dy="17.5">reject the Pod outright</tspan></text>
  <text x="746" y="266" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
