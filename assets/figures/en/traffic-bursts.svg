<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 242" width="760" height="242" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Training traffic: bursty, at full speed, repeating every step">
  <title>Training traffic: bursty, at full speed, repeating every step</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="242" rx="14" fill="#fbf9f4"/>
  <line x1="70" y1="170" x2="716" y2="170" stroke="#d9d4c8" stroke-width="1.2"/>
  <line x1="70" y1="170" x2="70" y2="46" stroke="#d9d4c8" stroke-width="1.2"/>
  <rect x="166" y="62" width="44" height="108" rx="3" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <rect x="322" y="62" width="44" height="108" rx="3" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <rect x="478" y="62" width="44" height="108" rx="3" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <rect x="634" y="62" width="44" height="108" rx="3" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <line x1="70" y1="140" x2="716" y2="140" stroke="#dc97a3" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">traffic on the NIC</text>
  <text x="76" y="58" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">full speed</text>
  <text x="76" y="132" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">average</text>
  <text x="130" y="192" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">forward, backward: idle</text>
  <text x="344" y="192" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">sync gradients</text>
  <text x="716" y="192" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">repeats every training step</text>
  <text x="24" y="214" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">All GPUs start sending at once, at full speed from the start: average utilisation is low, yet at any instant it is often full</text>
  <text x="746" y="234" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
