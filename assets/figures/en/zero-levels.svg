<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="The 16 bytes and ZeRO&#x27;s three levels">
  <title>The 16 bytes and ZeRO&#x27;s three levels</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="316" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Mixed precision with Adam: 16 bytes per parameter</text>
  <rect x="24" y="50" width="85.0" height="52" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="66.5" y="72.0" font-size="12.2" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Parameters</text>
  <text x="66.5" y="93.0" font-size="11.8" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">16-bit, 2</text>
  <rect x="113.0" y="50" width="85.0" height="52" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="155.5" y="72.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">Gradients</text>
  <text x="155.5" y="93.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">16-bit, 2</text>
  <rect x="202.0" y="50" width="174.0" height="52" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="289.0" y="72.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">master copy</text>
  <text x="289.0" y="93.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">32-bit, 4</text>
  <rect x="380.0" y="50" width="174.0" height="52" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="467.0" y="72.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">1st moment</text>
  <text x="467.0" y="93.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">32-bit, 4</text>
  <rect x="558.0" y="50" width="174.0" height="52" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="645.0" y="72.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing="0">2nd moment</text>
  <text x="645.0" y="93.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing="0">32-bit, 4</text>
  <text x="24" y="126" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">Blue is for computation, violet is the optimizer&#x27;s side (12 bytes, three quarters)</text>
  <text x="24" y="164" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">After each ZeRO level, what each GPU stores per parameter (with many GPUs)</text>
  <text x="24" y="193" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">data parallelism</text>
  <rect x="190" y="178" width="352" height="20" rx="5" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="552" y="193" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">16 bytes</text>
  <text x="736" y="193" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">traffic 1×</text>
  <text x="24" y="221" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">level 1: optimizer state</text>
  <rect x="190" y="206" width="88" height="20" rx="5" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="288" y="221" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">about 4 bytes</text>
  <text x="736" y="221" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">traffic 1×</text>
  <text x="24" y="249" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">level 2: + gradients</text>
  <rect x="190" y="234" width="44" height="20" rx="5" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="244" y="249" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">about 2 bytes</text>
  <text x="736" y="249" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">traffic 1×</text>
  <text x="24" y="277" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing="0">level 3: + parameters</text>
  <rect x="190" y="262" width="11" height="20" rx="5" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="211.0" y="277" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">16/N bytes</text>
  <text x="736" y="277" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing="0">traffic about 1.5×</text>
  <text x="746" y="308" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
