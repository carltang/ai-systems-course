<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="四种等待的分类">
  <title>四种等待的分类</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="300" rx="14" fill="#fbf9f4"/>
  <rect x="290" y="22" width="180" height="46" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="380.0" y="50.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">GPU 这段时间在干什么</text>
  <rect x="70" y="104" width="250" height="46" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="195.0" y="123.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">没在干活</text>
  <text x="195.0" y="144.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">利用率低于 100%</text>
  <rect x="440" y="104" width="250" height="46" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="565.0" y="123.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">在干活，但不够快</text>
  <text x="565.0" y="144.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">利用率可能显示 100%</text>
  <line x1="340" y1="70" x2="230" y2="102" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="420" y1="70" x2="530" y2="102" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="24" y="196" width="118" height="62" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="83.0" y="223.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">等数据</text>
  <text x="83.0" y="244.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">存储、预处理、拷贝</text>
  <line x1="195" y1="152" x2="83" y2="194" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="154" y="196" width="118" height="62" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="213.0" y="223.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">等发令</text>
  <text x="213.0" y="244.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">Python 和框架太慢</text>
  <line x1="195" y1="152" x2="213" y2="194" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="284" y="196" width="118" height="62" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="343.0" y="223.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">等别的卡</text>
  <text x="343.0" y="244.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">同步梯度、网络</text>
  <line x1="195" y1="152" x2="343" y2="194" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="440" y="196" width="118" height="62" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="499.0" y="223.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">算力受限</text>
  <text x="499.0" y="244.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">运算单元满负荷</text>
  <rect x="572" y="196" width="118" height="62" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="631.0" y="223.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">带宽受限</text>
  <text x="631.0" y="244.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">在等显存送数据</text>
  <line x1="565" y1="152" x2="499" y2="194" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="565" y1="152" x2="631" y2="194" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="565" y="282" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">这两种合起来是“等计算”</text>
  <text x="746" y="291" font-size="9.5" fill="#b9b3a6" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
