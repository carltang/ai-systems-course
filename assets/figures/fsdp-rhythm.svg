<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="FSDP：用到哪一层才拼完整">
  <title>FSDP：用到哪一层才拼完整</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="236" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">一层在一步训练里的节奏（平时每张卡只存它的 1/N）</text>
  <text x="24" y="76" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">前向</text>
  <text x="24" y="140" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">反向</text>
  <rect x="90" y="54" width="144" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="162.0" y="72.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">all-gather</text>
  <text x="162.0" y="93.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">拼出完整参数</text>
  <rect x="240" y="54" width="164" height="44" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="322.0" y="81.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">这一层的前向</text>
  <rect x="410" y="54" width="144" height="44" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="482.0" y="72.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">释放</text>
  <text x="482.0" y="93.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">只留自己那 1/N</text>
  <rect x="90" y="118" width="124" height="44" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="152.0" y="136.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">all-gather</text>
  <text x="152.0" y="157.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">再拼一次</text>
  <rect x="220" y="118" width="164" height="44" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="302.0" y="136.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">这一层的反向</text>
  <text x="302.0" y="157.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">得到完整梯度</text>
  <rect x="390" y="118" width="154" height="44" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="467.0" y="136.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">reduce-scatter</text>
  <text x="467.0" y="157.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">梯度求和并切开</text>
  <rect x="550" y="118" width="94" height="44" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="597.0" y="145.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">释放</text>
  <text x="24" y="196" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">显存峰值 ≈ 自己那 1/N 的模型状态 + 正在用的一两层完整参数 + 激活值</text>
  <text x="24" y="216" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">提前把下一层的 all-gather 发出去（预取），它就能藏在当前层的计算后面</text>
</svg>
