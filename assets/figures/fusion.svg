<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="算子融合：中间结果不落地">
  <title>算子融合：中间结果不落地</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="290" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">分开执行：三个 kernel，中间结果写回显存再读出来</text>
  <rect x="24" y="52" width="70" height="40" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="59.0" y="77.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">x, w</text>
  <rect x="150" y="52" width="84" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="192.0" y="77.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">乘法</text>
  <rect x="290" y="52" width="70" height="40" rx="10" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="325.0" y="77.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">t1</text>
  <rect x="416" y="52" width="84" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="458.0" y="77.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">加法</text>
  <rect x="556" y="52" width="70" height="40" rx="10" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="591.0" y="77.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">t2</text>
  <rect x="682" y="52" width="54" height="40" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="709.0" y="77.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">gelu</text>
  <line x1="96" y1="72" x2="148" y2="72" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="236" y1="72" x2="288" y2="72" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="362" y1="72" x2="414" y2="72" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="502" y1="72" x2="554" y2="72" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="628" y1="72" x2="680" y2="72" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="325" y="112" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">临时张量</text>
  <text x="591" y="112" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">临时张量</text>
  <text x="24" y="136" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">读 5n、写 3n，共 8n 次显存访问（b 在加法处读入，y 在最后写出）</text>
  <text x="24" y="186" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">融合：一个 kernel，中间结果只在寄存器里</text>
  <rect x="24" y="204" width="90" height="40" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="69.0" y="229.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">x, w, b</text>
  <rect x="190" y="204" width="380" height="40" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="380.0" y="229.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">乘 → 加 → gelu</text>
  <rect x="646" y="204" width="90" height="40" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="691.0" y="229.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">y</text>
  <line x1="116" y1="224" x2="188" y2="224" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="572" y1="224" x2="644" y2="224" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="24" y="270" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">读 3n、写 n，共 4n 次：访问量减半，时间也大约减半</text>
  <text x="746" y="281" font-size="9.5" fill="#b9b3a6" text-anchor="end" letter-spacing=".04em">© Zongyao Tang with Claude · CC BY-NC-SA 4.0</text>
</svg>
