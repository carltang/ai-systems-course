<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="共享一张卡的三种方式">
  <title>共享一张卡的三种方式</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="268" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">一张卡给几个 Pod 用的三种方式</text>
  <text x="136" y="62" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">时间片</text>
  <rect x="24" y="74" width="224" height="96" rx="12" fill="#ffffff" stroke="#c9c5ba" stroke-width="1.2"/>
  <rect x="36" y="98" width="30" height="48" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="51.0" y="127.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em"></text>
  <rect x="70" y="98" width="30" height="48" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="85.0" y="127.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em"></text>
  <rect x="104" y="98" width="30" height="48" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="119.0" y="127.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em"></text>
  <rect x="138" y="98" width="30" height="48" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="153.0" y="127.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em"></text>
  <rect x="172" y="98" width="30" height="48" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="187.0" y="127.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em"></text>
  <rect x="206" y="98" width="30" height="48" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="221.0" y="127.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em"></text>
  <text x="136" y="192" font-size="13" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing=".02em">轮流执行</text>
  <text x="136" y="212" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">没有显存隔离，没有故障隔离</text>
  <text x="380" y="62" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">MPS</text>
  <rect x="268" y="74" width="224" height="96" rx="12" fill="#ffffff" stroke="#c9c5ba" stroke-width="1.2"/>
  <rect x="280" y="88" width="200" height="30" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="380.0" y="108.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em"></text>
  <rect x="280" y="126" width="200" height="30" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="380.0" y="146.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em"></text>
  <text x="380" y="192" font-size="13" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing=".02em">真正同时执行</text>
  <text x="380" y="212" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">显存可以设上限，故障隔离弱</text>
  <text x="624" y="62" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">MIG</text>
  <rect x="512" y="74" width="224" height="96" rx="12" fill="#ffffff" stroke="#c9c5ba" stroke-width="1.2"/>
  <rect x="524" y="88" width="96" height="68" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="572.0" y="127.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em"></text>
  <rect x="628" y="88" width="96" height="68" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="676.0" y="127.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em"></text>
  <line x1="624" y1="80" x2="624" y2="164" stroke="#2b303b" stroke-width="1.6"/>
  <text x="624" y="192" font-size="13" fill="#2b303b" font-weight="400" text-anchor="middle" letter-spacing=".02em">切成固定规格的实例</text>
  <text x="624" y="212" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">硬件级的显存隔离，故障隔离强</text>
  <text x="24" y="250" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">蓝色和黄色是两个 Pod。多卡训练要独占整卡，不参与共享；要小心的是自己的卡被悄悄配成了共享</text>
  <text x="746" y="259" font-size="9.5" fill="#b9b3a6" text-anchor="end" letter-spacing=".04em">Zongyao Tang & Claude · CC BY-NC-SA 4.0</text>
</svg>
