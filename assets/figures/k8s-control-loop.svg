<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="Kubernetes 的声明式控制">
  <title>Kubernetes 的声明式控制</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="352" rx="14" fill="#fbf9f4"/>
  <rect x="300" y="126" width="160" height="84" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="380.0" y="164.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">API 服务器</text>
  <text x="380.0" y="185.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">所有对象的 spec 和 status</text>
  <rect x="24" y="136" width="150" height="64" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="99.0" y="164.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">你</text>
  <text x="99.0" y="185.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">kubectl apply</text>
  <line x1="176" y1="168" x2="298" y2="168" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="237.0" y="161.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">提交想要的状态</text>
  <rect x="300" y="24" width="160" height="58" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="380.0" y="49.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">Job 控制器</text>
  <text x="380.0" y="70.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">缺 Pod 就创建</text>
  <rect x="576" y="60" width="160" height="58" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="656.0" y="85.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">调度器</text>
  <text x="656.0" y="106.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">给 Pod 选节点</text>
  <rect x="576" y="218" width="160" height="58" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="656.0" y="243.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">kubelet</text>
  <text x="656.0" y="264.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">在节点上启动容器</text>
  <rect x="300" y="250" width="160" height="58" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="380.0" y="275.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">其他控制器</text>
  <text x="380.0" y="296.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">各管一类对象</text>
  <line x1="360" y1="84" x2="360" y2="124" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="400" y1="124" x2="400" y2="84" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="462" y1="150" x2="574" y2="100" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="574" y1="112" x2="462" y2="162" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="462" y1="178" x2="574" y2="232" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="574" y1="246" x2="462" y2="192" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="360" y1="212" x2="360" y2="248" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="400" y1="248" x2="400" y2="212" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="596" y="168" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">看到该自己做的 → 动手 → 写回结果</text>
  <text x="24" y="334" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">没有谁在指挥：每个参与者只盯着自己关心的对象</text>
</svg>
