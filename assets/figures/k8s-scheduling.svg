<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" width="760" height="248" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="调度器的两步">
  <title>调度器的两步</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="248" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">调度器给一个 Pod 选节点：先过滤，再打分</text>
  <rect x="24" y="60" width="130" height="60" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="89.0" y="86.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">Pod</text>
  <text x="89.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">requests、标签要求</text>
  <rect x="200" y="60" width="180" height="60" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="290.0" y="86.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">过滤</text>
  <text x="290.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">排除不能用的节点</text>
  <rect x="426" y="60" width="150" height="60" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="501.0" y="86.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">打分</text>
  <text x="501.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">剩下的选最高的</text>
  <rect x="622" y="60" width="114" height="60" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="679.0" y="86.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">写入节点名</text>
  <text x="679.0" y="107.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">交给 kubelet</text>
  <line x1="156" y1="90" x2="198" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="382" y1="90" x2="424" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="578" y1="90" x2="620" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="290" y="140" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">资源不够、标签不符</text>
  <text x="290" y="158" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">污点不容忍、卷挂不了</text>
  <text x="24" y="196" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">它一次只看一个 Pod，只看数量够不够：不知道哪些 Pod 是一个作业、谁和谁通信多、卡和核在不在同一侧</text>
  <text x="24" y="216" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">这三件事要靠 8.2 讲的成组调度、拓扑感知和 kubelet 的拓扑管理器</text>
  <text x="746" y="240" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
