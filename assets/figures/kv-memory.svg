<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="KV cache 的大小">
  <title>KV cache 的大小</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="232" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">32 层、隐藏维度 4096、16 位存储的模型：KV cache 有多大</text>
  <text x="24" y="74" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">模型权重</text>
  <rect x="190" y="54" width="118" height="28" rx="6" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="319.6" y="73" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">14 GB</text>
  <text x="24" y="112" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">每个 token</text>
  <rect x="190" y="92" width="4" height="28" rx="6" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="206" y="111" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">约 0.5 MB</text>
  <text x="24" y="150" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">4000 token 的对话</text>
  <rect x="190" y="130" width="17" height="28" rx="6" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="218.8" y="149" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">约 2 GB</text>
  <text x="24" y="188" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">10 万 token 的长文档</text>
  <rect x="190" y="168" width="420" height="28" rx="6" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="622.0" y="187" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">约 50 GB，超过了权重</text>
  <text x="24" y="218" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">每个并发的请求各要一份；它随序列长度和并发数增长，是推理显存的大头</text>
  <text x="746" y="223" font-size="9.5" fill="#b9b3a6" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
