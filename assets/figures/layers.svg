<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="同一条管道的六层">
  <title>同一条管道的六层</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="372" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">同一行 y = model(x)，每往下一层换一种语言</text>
  <rect x="24" y="54" width="712" height="42" rx="9" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="48" y="81" font-size="15" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">算法</text>
  <text x="120" y="81" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">算什么：矩阵乘法、注意力、归一化</text>
  <text x="716" y="81" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing=".02em">第 1、10 部分</text>
  <rect x="24" y="106" width="712" height="42" rx="9" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="48" y="133" font-size="15" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">框架</text>
  <text x="120" y="133" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">怎么把 Python 变成一连串 GPU 任务</text>
  <text x="716" y="133" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing=".02em">第 2 部分</text>
  <rect x="24" y="158" width="712" height="42" rx="9" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="48" y="185" font-size="15" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">算子</text>
  <text x="120" y="185" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">一个 kernel 怎么写才快</text>
  <text x="716" y="185" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing=".02em">第 4 部分</text>
  <rect x="24" y="210" width="712" height="42" rx="9" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="48" y="237" font-size="15" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">硬件</text>
  <text x="120" y="237" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">GPU 实际怎么执行这些线程</text>
  <text x="716" y="237" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing=".02em">第 3 部分</text>
  <rect x="24" y="262" width="712" height="42" rx="9" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="48" y="289" font-size="15" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">通信</text>
  <text x="120" y="289" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">多张卡之间怎么交换数据</text>
  <text x="716" y="289" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing=".02em">第 5–7 部分</text>
  <rect x="24" y="314" width="712" height="42" rx="9" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="48" y="341" font-size="15" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">集群</text>
  <text x="120" y="341" font-size="13.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">作业怎么排队、放到哪些机器上</text>
  <text x="716" y="341" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing=".02em">第 8 部分</text>
  <text x="746" y="363" font-size="9.5" fill="#b9b3a6" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
