<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="NVLink、PCIe 和网卡的带宽">
  <title>NVLink、PCIe 和网卡的带宽</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="220" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">一张 H100 能用的三条路（官方数字）</text>
  <text x="24" y="78" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">NVLink</text>
  <rect x="150" y="56" width="580" height="32" rx="7" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="164" y="77" font-size="12.5" fill="#2b303b" font-weight="400" text-anchor="start" letter-spacing=".02em">18 条，两个方向合计 900 GB/s</text>
  <text x="24" y="124" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">PCIe Gen5 x16</text>
  <rect x="150" y="102" width="83" height="32" rx="7" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="245" y="123" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">两个方向合计 128 GB/s（每个方向 64）</text>
  <text x="24" y="170" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="start" letter-spacing=".02em">400 Gb/s 网卡</text>
  <rect x="150" y="148" width="32" height="32" rx="7" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="194" y="169" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">约 50 GB/s</text>
  <text x="24" y="204" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">机内和跨机差一个量级：通信最频繁的并行方式必须留在机内</text>
  <text x="746" y="211" font-size="9.5" fill="#b9b3a6" text-anchor="end" letter-spacing=".04em">© Zongyao Tang with Claude · CC BY-NC-SA 4.0</text>
</svg>
