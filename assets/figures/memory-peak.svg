<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="一步训练里显存占用的起落">
  <title>一步训练里显存占用的起落</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="220" rx="14" fill="#fbf9f4"/>
  <line x1="70" y1="176" x2="716" y2="176" stroke="#d9d4c8" stroke-width="1.2"/>
  <line x1="70" y1="176" x2="70" y2="46" stroke="#d9d4c8" stroke-width="1.2"/>
  <polyline points="70,150 330,64 600,150 716,150" fill="none" stroke="#8aa2e6" stroke-width="2.4" stroke-linejoin="round"/>
  <line x1="330" y1="64" x2="330" y2="176" stroke="#d9d4c8" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">显存占用</text>
  <text x="200" y="200" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">前向：一路保存中间结果</text>
  <text x="470" y="200" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">反向：走过一个节点，放掉一份</text>
  <text x="340" y="58" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">峰值在前向结束、反向开始的那一刻</text>
</svg>
