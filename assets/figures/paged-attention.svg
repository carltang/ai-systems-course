  <text x="160.0" y="162.0" font-size="12" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">块 1</text>
  <rect x="186" y="140" width="44" height="34" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="208.0" y="162.0" font-size="12" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">…</text>
  <rect x="330" y="78" width="110" height="78" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="385.0" y="113.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">页表</text>
  <text x="385.0" y="134.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">逻辑块 → 物理块</text>
