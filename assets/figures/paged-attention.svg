  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">每个请求以为自己的缓存是连续的</text>
  <text x="736" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing=".02em">显存里：固定大小的块，哪里有空放哪里</text>
