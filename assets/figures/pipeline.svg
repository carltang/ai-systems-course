<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="训练一步的管道和四种等待">
  <title>训练一步的管道和四种等待</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="266" rx="14" fill="#fbf9f4"/>
  <text x="24" y="36" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">一步训练，从左到右依次经过</text>
  <rect x="24" y="70" width="104" height="64" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="76.0" y="98.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">1 读取与预处理</text>
  <text x="76.0" y="119.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">存储 → CPU</text>
  <rect x="146" y="70" width="104" height="64" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="198.0" y="98.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">2 拼 batch</text>
  <text x="198.0" y="119.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">锁页内存</text>
  <line x1="130" y1="102" x2="144" y2="102" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="268" y="70" width="104" height="64" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
  <text x="320.0" y="98.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">3 拷上 GPU</text>
  <text x="320.0" y="119.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">PCIe</text>
  <line x1="252" y1="102" x2="266" y2="102" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="390" y="70" width="104" height="64" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="442.0" y="98.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">4 前向 · 反向</text>
  <text x="442.0" y="119.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">GPU</text>
  <line x1="374" y1="102" x2="388" y2="102" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="512" y="70" width="104" height="64" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="564.0" y="98.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">5 梯度同步</text>
  <text x="564.0" y="119.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">NVLink / 网络</text>
  <line x1="496" y1="102" x2="510" y2="102" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="634" y="70" width="104" height="64" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="686.0" y="98.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">6 优化器</text>
  <text x="686.0" y="119.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">GPU</text>
  <line x1="618" y1="102" x2="632" y2="102" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="24" y="158" width="348" height="6" rx="3" fill="#e0b860"/>
  <text x="198.0" y="182" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">等数据</text>
  <rect x="390" y="158" width="104" height="6" rx="3" fill="#8aa2e6"/>
  <text x="442.0" y="182" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">等计算</text>
  <rect x="512" y="158" width="104" height="6" rx="3" fill="#7fbf99"/>
  <text x="564.0" y="182" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">等别的卡</text>
  <rect x="634" y="158" width="104" height="6" rx="3" fill="#8aa2e6"/>
  <text x="686.0" y="182" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">等计算</text>
  <rect x="390" y="206" width="348" height="6" rx="3" fill="#a892dc"/>
  <text x="564.0" y="230" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">等发令：CPU 上的 Python 来不及把下一个任务派给 GPU</text>
  <text x="746" y="258" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
