<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="Job、Pod 和容器">
  <title>Job、Pod 和容器</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="250" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">Job 按模板创建 Pod；Pod 是一次性的，坏了就换一个新的</text>
  <rect x="24" y="56" width="150" height="64" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="99.0" y="84.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">Job</text>
  <text x="99.0" y="105.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">要成功几个、重试几次</text>
  <rect x="240" y="56" width="200" height="64" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="340.0" y="84.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">Pod</text>
  <text x="340.0" y="105.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">一个或几个容器，在同一个节点上</text>
  <rect x="506" y="56" width="230" height="64" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="621.0" y="84.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">容器</text>
  <text x="621.0" y="105.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">镜像里是 Python、PyTorch 和你的代码</text>
  <line x1="176" y1="88" x2="238" y2="88" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="207.0" y="81.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">创建</text>
  <line x1="442" y1="88" x2="504" y2="88" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="473.0" y="81.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">包着</text>
  <text x="24" y="160" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">Pod 的状态</text>
  <rect x="120" y="142" width="130" height="44" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="185.0" y="160.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">Pending</text>
  <text x="185.0" y="181.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">等调度、拉镜像</text>
  <rect x="300" y="142" width="130" height="44" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="365.0" y="160.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">Running</text>
  <text x="365.0" y="181.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">容器在运行</text>
  <rect x="480" y="130" width="120" height="32" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="540.0" y="151.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">Succeeded</text>
  <rect x="480" y="168" width="120" height="32" rx="10" fill="#fbe9ec" stroke="#dc97a3" stroke-width="1.2"/>
  <text x="540.0" y="189.0" font-size="13" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">Failed</text>
  <line x1="252" y1="164" x2="298" y2="164" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="432" y1="158" x2="478" y2="148" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="432" y1="170" x2="478" y2="182" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="612" y="150" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">退出码是零</text>
  <text x="612" y="188" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">退出码非零</text>
  <text x="24" y="232" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">Failed 的 Pod 不会被修复：Job 按重试规则再建一个，名字和地址都不一样</text>
  <text x="746" y="241" font-size="9.5" fill="#b9b3a6" text-anchor="end" letter-spacing=".04em">Zongyao Tang & Claude · CC BY-NC-SA 4.0</text>
</svg>
