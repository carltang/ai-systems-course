  <text x="508.0" y="91.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em"></text>
  <rect x="536" y="56" width="44" height="60" rx="10" fill="#fdf3dc" stroke="#e0b860" stroke-width="1.2"/>
