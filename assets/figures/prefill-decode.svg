  <rect x="24" y="130" width="250" height="6" rx="3" fill="#8aa2e6"/>
  <rect x="286" y="130" width="444" height="6" rx="3" fill="#e0b860"/>
  <text x="149" y="158" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">prefill：大矩阵乘大矩阵，受算力限制</text>
  <text x="508" y="158" font-size="12.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">decode：一步一个新 token，矩阵乘向量，受显存带宽限制</text>
  <text x="149" y="178" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">产出：第一个新 token，和整段的 KV cache</text>
  <text x="508" y="178" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">每一步都把权重和这个请求的缓存读一遍</text>
  <text x="24" y="214" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">同一个模型、同一个请求，前后两段撞在硬件的两个不同上限上</text>
