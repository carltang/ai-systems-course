<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="强化学习的两条路线">
  <title>强化学习的两条路线</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="290" rx="14" fill="#fbf9f4"/>
  <rect x="280" y="20" width="200" height="52" rx="10" fill="#f1f0ec" stroke="#c9c5ba" stroke-width="1.2"/>
  <text x="380.0" y="42.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">时序差分（TD）</text>
  <text x="380.0" y="63.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">用下一步的估计修正这一步</text>
  <rect x="40" y="116" width="250" height="62" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="165.0" y="143.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">价值路线</text>
  <text x="165.0" y="164.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">学 Q(s, a)，选分数最高的动作</text>
  <rect x="470" y="116" width="250" height="62" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="595.0" y="143.0" font-size="15" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">策略路线</text>
  <text x="595.0" y="164.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">直接提高好动作的概率</text>
  <rect x="255" y="212" width="250" height="58" rx="10" fill="#e8eefc" stroke="#8aa2e6" stroke-width="1.2"/>
  <text x="380.0" y="237.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">actor-critic → PPO</text>
  <text x="380.0" y="258.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">评论家打分，演员改进；每次只改一小步</text>
  <line x1="350" y1="74" x2="252" y2="114" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <line x1="165" y1="180" x2="300" y2="214" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="198.5" y="207.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">DQN</text>
  <line x1="595" y1="180" x2="460" y2="214" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="579.5" y="207.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">REINFORCE</text>
  <line x1="430" y1="74" x2="440" y2="210" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#tip)"/>
  <text x="40" y="104" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">动作少而离散；旧数据可反复用</text>
  <text x="720" y="104" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="end" letter-spacing=".02em">任意动作；只能用刚产生的数据</text>
  <text x="746" y="281" font-size="9.5" fill="#9AA5B4" text-anchor="end" letter-spacing=".04em">Zongyao Tang &amp; Claude · CC BY-NC-SA 4.0</text>
</svg>
