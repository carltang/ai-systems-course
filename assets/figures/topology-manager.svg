<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" width="760" height="244" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="拓扑管理器">
  <title>拓扑管理器</title>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="244" rx="14" fill="#fbf9f4"/>
  <text x="24" y="34" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">kubelet 里三方各管一样资源，默认各自为政</text>
  <rect x="24" y="52" width="220" height="42" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="134.0" y="69.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">CPU 管理器</text>
  <text x="134.0" y="90.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">分配具体的 CPU 核</text>
  <line x1="246" y1="73" x2="328" y2="100" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="24" y="104" width="220" height="42" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="134.0" y="121.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">内存管理器</text>
  <text x="134.0" y="142.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">内存从哪个 NUMA 节点分</text>
  <line x1="246" y1="125" x2="328" y2="110" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="24" y="156" width="220" height="42" rx="10" fill="#ffffff" stroke="#cfc9bb" stroke-width="1.2"/>
  <text x="134.0" y="173.0" font-size="13.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">设备管理器</text>
  <text x="134.0" y="194.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">分配具体的 GPU 和网卡</text>
  <line x1="246" y1="177" x2="328" y2="120" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <rect x="330" y="84" width="170" height="62" rx="10" fill="#efe9fb" stroke="#a892dc" stroke-width="1.2"/>
  <text x="415.0" y="111.0" font-size="14.5" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">拓扑管理器</text>
  <text x="415.0" y="132.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">求交集</text>
  <text x="415" y="70" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">各方报告：我能在哪几侧满足</text>
  <rect x="566" y="84" width="170" height="62" rx="10" fill="#e4f3ea" stroke="#7fbf99" stroke-width="1.2"/>
  <text x="651.0" y="111.0" font-size="14" fill="#2b303b" font-weight="500" text-anchor="middle" letter-spacing=".02em">按结果分配</text>
  <text x="651.0" y="132.0" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle" letter-spacing=".02em">核、内存、卡在同一侧</text>
  <line x1="502" y1="115" x2="564" y2="115" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tip)"/>
  <text x="24" y="226" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing=".02em">策略由管理员在 kubelet 上设置，默认是 none（不协调）；对不齐时，严格的策略会直接拒绝这个 Pod</text>
</svg>
